<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMF Records — Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="DMF" onerror="this.style.display='none'">
      <span>DMF Records</span>
    </div>
    <div class="nav">
      <a href="index.html"   class="nav-item active"><span class="nav-icon">👥</span> Roster</a>
      <a href="studio.html"  class="nav-item"><span class="nav-icon">🎛️</span> Studio</a>
      <a href="video.html"   class="nav-item"><span class="nav-icon">🎬</span> Video</a>
      <a href="workshop.html" class="nav-item"><span class="nav-icon">🔧</span> Workshop</a>
    </div>
    <div style="padding:12px 16px;font-size:11px;color:var(--muted)">
      Fly Hoolie ENT Co.<br>est. 2009 · Columbus, OH
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">Artist Roster</div>
        <div class="topbar-sub">DMF Records — Fly Hoolie ENT Co.</div>
      </div>
      <button class="btn btn-gold btn-sm" onclick="refreshRoster()">↺ Refresh</button>
    </div>

    <div class="content">
      <!-- Stats -->
      <div class="grid grid-4 mb-2" id="stats">
        <div class="card stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Artists</div></div>
        <div class="card stat"><div class="stat-val" id="stat-active">—</div><div class="stat-lbl">Active</div></div>
        <div class="card stat"><div class="stat-val" id="stat-followers">—</div><div class="stat-lbl">Total Spotify Followers</div></div>
        <div class="card stat"><div class="stat-val" id="stat-since">2009</div><div class="stat-lbl">Label Founded</div></div>
      </div>

      <!-- Roster table -->
      <div class="card">
        <div class="flex items-center justify-between mb-2">
          <div class="card-title">All Artists</div>
          <input id="search" type="text" placeholder="Search artists…" style="width:200px" oninput="filterRoster()">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Artist</th>
                <th>Role</th>
                <th>Genres</th>
                <th>Spotify Followers</th>
                <th>Popularity</th>
                <th>Since</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="roster-body">
              <tr><td colspan="7" class="text-muted" style="text-align:center;padding:32px">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
