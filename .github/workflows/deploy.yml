name: Deploy

on:
  push:
    branches: [main]

jobs:

  # ── Deploy Frontend → Vercel ─────────────────────────────────────────────

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/frontend
          vercel-args: "--prod"

  # ── Deploy Backend → Railway ──────────────────────────────────────────────
  #
  # Railway auto-deploys on push when connected to GitHub.
  # This job is a post-deploy smoke test.

  smoke-test-api:
    name: API Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    if: ${{ vars.API_URL != '' }}

    steps:
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.API_URL }}/health")
          echo "API health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — got $STATUS"
            exit 1
          fi
          echo "API is healthy"

      - name: Root endpoint check
        run: |
          RESP=$(curl -s "${{ vars.API_URL }}/")
          echo "Root response: $RESP"

  # ── Run DB Migrations on Deploy ───────────────────────────────────────────
  #
  # Railway can run this as a pre-deploy command in railway.toml.
  # Alternatively trigger from here via Railway CLI.

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: []
    if: ${{ secrets.RAILWAY_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run migrations
        working-directory: services/dariyah-core
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run alembic upgrade head
