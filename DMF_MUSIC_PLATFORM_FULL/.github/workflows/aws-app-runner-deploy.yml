name: Deploy to AWS App Runner

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  release-checklist:
    name: Release Checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required production env vars
        env:
          REQUIRED_ENV_VARS: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_APP_RUNNER_SERVICE_ARN,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_BASE_URL,NEXT_PUBLIC_APP_NAME
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_APP_RUNNER_SERVICE_ARN: ${{ secrets.AWS_APP_RUNNER_SERVICE_ARN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
        run: node scripts/check-required-env.mjs

  deploy:
    name: Build & Deploy DaRiyah Platform
    needs: release-checklist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build DaRiyah frontend
        run: pnpm --filter @dariyah/web build

      - name: Push to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service_arn: ${{ secrets.AWS_APP_RUNNER_SERVICE_ARN }}
          source-directory: "frontend"
          runtime: "NODEJS_20"
          build-command: "pnpm install && pnpm build"
          start-command: "pnpm start"
